name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        django: ["Django>=4.2,<5.0", "Django>=5.2,<6"]
    env:
      CAPQUERY_TEST_DB_HOST: localhost
      CAPQUERY_TEST_DB_PORT: "5432"
      CAPQUERY_TEST_DB_USER: postgres
      CAPQUERY_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-xdist "${{ matrix.django }}"
      - name: Unit tests
        run: pytest -q -m "not benchmark"
      - name: Benchmark
        run: pytest -q -s -m benchmark
