[project]
name = "pytest-django-capquery"
version = "0.0.2a11"
description = "Pytest capture Django ORM queries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]
classifiers = [
    "Framework :: Pytest",
]


[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="capquery"

[project.entry-points.pytest11]
django-capquery = "pytest_django_capquery.plugin"
